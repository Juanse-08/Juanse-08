name: Generate Snake

on:
  schedule:
    - cron: "0 */12 * * *"   # cada 12 h
  workflow_dispatch:          # ejecutar a mano desde la pestaña Actions
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Generar snake desde el grafico de contribuciones
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#99FF00&color_dots=#161b22,#0e4429,#006d32,#26a641,#39d353

      - name: Publicar en la rama output
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
